name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python3 -m py_compile desktop.py style.py sources.py verify-after-login.py tools/localize-menus.py
      - name: Theme tool tests
        run: python3 tests/test_style.py
      - name: Extension integration tests (skipped if extensions are absent)
        run: tests/run-extension-tests.sh
